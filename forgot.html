<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="form-box">
    <div class="top-icon"><i class="fa-solid fa-key"></i></div>
    <h2>Forgot Password?</h2>
    <p>Enter your email to reset your password</p>

    <form action="login.html">
        <label>Email Address</label>
        <div class="input-box">
            <i class="fa-solid fa-envelope pink"></i>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Reset Password</button>
    </form>

    <div class="links">
        <p><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
        <p>New user? <a href="signup.html">Sign Up</a></p>
    </div>
</div>

</body>
</html>
